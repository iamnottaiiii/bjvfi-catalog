name: Rebuild catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [sites-updated]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild catalog (add missing slugs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/rebuild_sites_json.py
      - name: Commit and push if changed
        run: |
          git config user.name "Not Ai"
          git config user.email "iamnottaiii@gmail.com"
          git add sites-1.json sites-2.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Rebuild catalog: add missing slugs" && git push)
